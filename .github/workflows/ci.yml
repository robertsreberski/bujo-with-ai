name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record toolchain
        run: node --version && npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Audit high-severity production and development dependencies
        run: npm audit --audit-level=high
      - name: Typecheck, lint, test, and build
        run: npm run check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Typecheck the browser harness
        run: npm exec tsc -- --project e2e/tsconfig.json
      - name: Run production-bundle browser tests
        run: npm run test:e2e
        env:
          CI: true
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
